# Streamlit Secrets Template for baptismal_app.py (PLACEHOLDERS ONLY — NEVER COMMIT REAL SECRETS)

# PostgreSQL Connection String (Supabase / Neon / RDS)
BAPTISMAL_DATABASE_URL = "postgresql://USER:PASSWORD@HOST:5432/baptismal_db?sslmode=require"

# Initial Master Admin Provisioning (Optional one-time bootstrap; remove after first login or use PBKDF2 hash)
BAPTISMAL_INITIAL_ADMIN_USER = "YOUR_MASTER_ADMIN_USERNAME"
BAPTISMAL_INITIAL_ADMIN_PASSWORD_HASH = "pbkdf2_sha256$310000$REPLACE_WITH_SALT$REPLACE_WITH_HASH"
BAPTISMAL_INITIAL_ADMIN_EMAIL = "admin@example.org"

# Google Drive Designated Files & Private Folder IDs (Do NOT leave blank if using Drive sync)
BAPTISMAL_ROOT_FOLDER_ID = "REPLACE_WITH_CTG_BAPTISMAL_SYSTEM_FOLDER_ID"
BAPTISMAL_WORKBOOK_FILE_ID = "REPLACE_WITH_OVERALL_BAPTISMAL_CERTIFICATE_LIST_XLSX_ID"

# Google Drive OAuth 2.0 Credentials (Option A)
BAPTISMAL_GOOGLE_CLIENT_ID = "REPLACE_WITH_OAUTH_CLIENT_ID"
BAPTISMAL_GOOGLE_CLIENT_SECRET = "REPLACE_WITH_OAUTH_CLIENT_SECRET"
BAPTISMAL_DRIVE_REFRESH_TOKEN = "REPLACE_WITH_DRIVE_REFRESH_TOKEN"

# OR Service Account JSON (Option B)
# [baptismal_service_account]
# type = "service_account"
# project_id = "your-project-id"
# private_key_id = "your-key-id"
# private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
# client_email = "service-account@your-project.iam.gserviceaccount.com"
